<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐 🎂</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
        <div id="fireworkVideo" class="firework-video hidden">
            <video id="fireworkMovie" autoplay muted loop playsinline preload="auto">
                <source src="video/birthday.mp4" type="video/mp4">
            </video>
        </div>
    <div class="birthday-container">

        <div class="present-page">
        <div class="balloons">
            <div class="balloon balloon1">🎈</div>
            <div class="balloon balloon2">🎈</div>
            <div class="balloon balloon3">🎈</div>
            <div class="balloon balloon4">🎈</div>
        </div>

        <h1>🎂 生日快乐！🎂</h1>

        <p class="subtitle">
            祝你生日快乐！
        </p>

        <div class="cake">
            🎂
        </div>

        <div class="gift-container">
            <div id="giftBox" class="gift-box">
                <video id="presentVideo" class="present-video" autoplay muted loop playsinline preload="auto">
                    <source src="video/present.mp4" type="video/mp4">
                </video>
            </div>

            <!-- <p class="gift-text">
                点击礼物，打开生日惊喜
            </p> -->
        </div>

        <button id="surpriseButton">
            🎁 打开礼物
        </button>

        <audio id="bgMusic" loop preload="auto">
            <source src="music/birthday.mp3" type="audio/mpeg">
        </audio>

        <button id="musicControl" class="music-control">
            🎵
        </button>

        <div id="message" class="hidden">
            <div id="photoSection" class="photo-section">
                <img
                    src="images/xiaohai.jpg"
                    alt="生日照片"
                    class="birthday-photo"
                >
            </div>
            <!-- 祝福视频弹窗 -->
            <div id="blessingVideoModal" class="blessing-video-modal">
                <button id="closeBlessingVideo" class="close-blessing-video" type="button">
                    ✕
                </button>

                <video id="blessingVideo" playsinline preload="metadata">
                    <source src="video/blessing.mp4" type="video/mp4">
                    你的浏览器不支持视频播放。
                </video>
            </div>
            <h2>✨ 写给你的话 ✨</h2>
            <p id="letterText" class="letter-text"></p>

            <p class="love">
                ❤️ 愿你每天都开心，永远被幸福包围！❤️
            </p>
        </div>

        
<!-- 生日回忆时间轴 -->
<section id="memoryTimeline" class="memory-timeline hidden">
    <div class="memory-heading">
        <p class="memory-eyebrow">OUR MEMORIES</p>
        <h2>一路走来的美好回忆</h2>
        <p class="memory-intro">每一张照片，都藏着一段珍贵的故事。</p>
    </div>

    <div class="memory-toolbar">
        <span id="memoryCounter">共 6 段回忆</span>
        <button id="memoryPlayBtn" type="button">
            ▶ 自动播放
        </button>
    </div>

    <div id="memoryList" class="memory-list">
        <!-- 照片卡片由 script.js 自动生成 -->
    </div>
</section>

<!-- 照片放大弹窗：独立于原有祝福视频弹窗 -->
<div id="memoryLightbox"
     class="memory-lightbox"
     role="dialog"
     aria-modal="true"
     aria-label="照片回忆">

    <button id="memoryClose"
            class="memory-close"
            type="button"
            aria-label="关闭照片">×</button>

    <button id="memoryPrev"
            class="memory-nav memory-prev"
            type="button"
            aria-label="上一张">‹</button>

    <div class="memory-viewer">
        <img id="memoryLargeImage" src="" alt="">
        <p id="memoryLargeDate"></p>
        <h3 id="memoryLargeTitle"></h3>
        <p id="memoryLargeText"></p>
        <p id="memoryLargeCount"></p>
    </div>

    <button id="memoryNext"
            class="memory-nav memory-next"
            type="button"
            aria-label="下一张">›</button>
</div>


    </div>

    <script src="script.js"></script>

</body>

</html>
