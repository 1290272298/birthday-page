<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐 🎂</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
        <div id="fireworkVideo" class="firework-video hidden">
            <video id="fireworkMovie" autoplay muted loop playsinlinepreload="auto">
                <source src="video/birthday.mp4" type="video/mp4">
            </video>
        </div>
    <div class="birthday-container">

        <div class="present-page">
        <div class="balloons">
            <div class="balloon balloon1">🎈</div>
            <div class="balloon balloon2">🎈</div>
            <div class="balloon balloon3">🎈</div>
            <div class="balloon balloon4">🎈</div>
        </div>

        <h1>🎂 生日快乐！🎂</h1>

        <p class="subtitle">
            祝你生日快乐！
        </p>

        <div class="cake">
            🎂
        </div>

        <div class="gift-container">
            <div id="giftBox" class="gift-box">
                <video id="presentVideo" class="present-video" autoplay muted loop playsinlinepreload="auto">
                    <source src="video/present.mp4" type="video/mp4">
                </video>
            </div>

            <!-- <p class="gift-text">
                点击礼物，打开生日惊喜
            </p> -->
        </div>

        <button id="surpriseButton">
            🎁 打开礼物
        </button>

        <audio id="bgMusic" loop preload="auto">
            <source src="music/birthday.mp3" type="audio/mpeg">
        </audio>

        <button id="musicControl" class="music-control">
            🎵
        </button>

        <div id="message" class="hidden">
            <div class="photo-section">
                <img
                    src="images/birthday-photo.jpg"
                    alt="生日照片"
                    class="birthday-photo"
                >
            </div>
            <h2>✨ 写给你的话 ✨</h2>
            <p id="letterText" class="letter-text"></p>

            <p class="love">
                ❤️ 愿你每天都开心，永远被幸福包围！❤️
            </p>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
